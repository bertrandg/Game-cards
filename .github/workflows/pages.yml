name: Publication sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # chaque publication ajoute ?v=<commit> aux fichiers : le téléphone ne garde pas en cache un mélange d'anciennes et de nouvelles versions
      - name: Versionner les fichiers
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s#css/app.css#css/app.css?v=$V#; s#js/main.js#js/main.js?v=$V#" index.html
          find js -name '*.js' -exec sed -i -E "s#((from |import\()'\.{1,2}/[a-z./]+\.js)'#\1?v=$V'#g" {} +
          grep -rc "?v=" index.html js | grep -v ':0$'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
